<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Virtual Physics Laboratory</title>
<meta name="description" content="Simulated physics laboratory experiments, grouped by programme, course and subject.">
<meta name="theme-color" content="#0e6e6b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&family=Spectral:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/css/base.css">
<link rel="stylesheet" href="shared/css/portal.css">
</head>
<body>

<header class="portal-head">
  <h1 id="siteTitle">Virtual Physics Laboratory</h1>
  <p class="place" id="sitePlace"></p>
  <p class="tagline" id="siteTagline"></p>
  <button class="ghost" id="installBtn" hidden style="margin-top:14px">Install on this device</button>
</header>

<div class="filters">
  <label><span>Programme</span><select id="fProgramme"></select></label>
  <label><span>Course</span><select id="fCourse"></select></label>
  <label><span>Subject</span><select id="fSubject"></select></label>
  <label><span>Search</span><input id="fSearch" type="search" placeholder="band spectrum, Hall, calibration…"></label>
  <span class="count" id="count"></span>
</div>

<main class="catalog" id="catalog"></main>


<script src="shared/js/pwa.js"></script>
<script src="shared/js/config.js"></script>
<script src="data/catalog.js"></script>
<script src="shared/js/portal.js"></script>
</body>
</html>
