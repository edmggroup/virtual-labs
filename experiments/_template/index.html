<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Experiment template — Virtual Physics Laboratory</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&family=Spectral:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../shared/css/base.css">
<link rel="stylesheet" href="css/experiment.css">
</head>
<body>

<header class="masthead" id="masthead"></header>

<div class="shell">
  <nav class="rail" id="rail" aria-label="Experiment steps"></nav>
  <main class="work">
    <!-- Apparatus goes here: a canvas, an SVG instrument, a form.
         Everything below the apparatus is written by js/app.js. -->
    <div id="steps"></div>
  </main>
</div>

<div id="toast" class="note" role="status" style="display:none;position:fixed;bottom:16px;right:16px;z-index:30;max-width:360px"></div>

<script src="../../shared/js/config.js"></script>
<script src="js/meta.js"></script>
<script src="../../shared/js/lab-submit.js"></script>
<script src="js/app.js"></script>
</body>
</html>
